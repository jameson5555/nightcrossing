name: Deploy Web to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_CLOUD_SAVE_ENABLED: ${{ vars.NC_CLOUD_SAVE_ENABLED || 'false' }}
          VITE_ACCOUNTS_API_PATH: /nightcrossing/api/index.php
          VITE_ANDROID_REWARDED_ADS_ENABLED: 'false'
          VITE_WEB_REWARDED_ADS_ENABLED: ${{ vars.NC_WEB_REWARDED_ADS_ENABLED || 'false' }}
          VITE_ADS_TEST_MODE: ${{ vars.NC_ADS_TEST_MODE || 'true' }}
          VITE_H5_PUBLISHER_ID: ${{ vars.NC_H5_PUBLISHER_ID }}
          VITE_WEB_ADS_REVIEWED: ${{ vars.NC_WEB_ADS_REVIEWED || 'false' }}
          VITE_WEB_US_AD_SERVING_VERIFIED: ${{ vars.NC_WEB_US_AD_SERVING_VERIFIED || 'false' }}
        run: npm run build

      - name: Setup PHP for account backend
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: curl, mbstring, openssl, pdo_mysql
          tools: composer:v2

      - name: Package private account backend
        run: |
          composer install --working-dir=server --no-dev --prefer-dist --no-interaction --no-progress
          npm run build:accounts

      - name: Save private backend for cPanel installation
        uses: actions/upload-artifact@v4
        with:
          name: nightcrossing-private
          path: artifacts/nightcrossing-private.zip
          retention-days: 14

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /nightcrossing/
          local-dir: ./dist/
