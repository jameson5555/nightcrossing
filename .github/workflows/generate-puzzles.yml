name: Generate Monthly Puzzles

on:
  schedule:
    # Run at 00:00 on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

concurrency:
  group: generate-monthly-puzzles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Enrich theme pools
        env:
          NC_ENRICH_REQUEST_TIMEOUT_MS: '12000'
        run: node scripts/fetch-theme-words.js

      - name: Generate new puzzles
        env:
          NC_MIN_FUTURE_RUNWAY_BATCHES: '2'
          NC_ENABLE_EASY_TOP_OFF: '0'
          NC_LAYOUT_ATTEMPT_SCALE: '0.2'
          NC_MAX_LAYOUT_QUALITY_RETRIES: '5'
          NC_NEW_PUZZLES_PER_THEME: '3'
          NC_PRIMARY_CORE_POOL_LIMIT: '120'
        run: node scripts/generate-starters.js --skip-enrichment

      - name: Audit generated dataset
        run: npm run audit:ci

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add scripts/themes.json scripts/candidate-themes.json scripts/theme-rotation.json public/data/puzzles.json public/data/puzzles.meta.json public/data/puzzles/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-generate new monthly puzzles" && git push)
