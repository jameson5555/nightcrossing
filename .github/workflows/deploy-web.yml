name: Deploy Web to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Build Web App
        env:
          VITE_CLOUD_SAVE_ENABLED: ${{ vars.NC_CLOUD_SAVE_ENABLED || 'false' }}
          VITE_FIREBASE_API_KEY: ${{ vars.NC_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.NC_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.NC_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.NC_FIREBASE_APP_ID }}
          VITE_ANDROID_REWARDED_ADS_ENABLED: 'false'
          VITE_WEB_REWARDED_ADS_ENABLED: ${{ vars.NC_WEB_REWARDED_ADS_ENABLED || 'false' }}
          VITE_ADS_TEST_MODE: ${{ vars.NC_ADS_TEST_MODE || 'true' }}
          VITE_H5_PUBLISHER_ID: ${{ vars.NC_H5_PUBLISHER_ID }}
          VITE_WEB_ADS_REVIEWED: ${{ vars.NC_WEB_ADS_REVIEWED || 'false' }}
          VITE_WEB_US_AD_SERVING_VERIFIED: ${{ vars.NC_WEB_US_AD_SERVING_VERIFIED || 'false' }}
        run: npm run build

      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /nightcrossing/
          local-dir: ./dist/
